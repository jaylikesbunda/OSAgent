# provider_type = "github-copilot"
# auth_type = "oauth"
# oauth_client_id = "your-github-oauth-app-client-id"  # Or set GITHUB-COPILOT_OAUTH_CLIENT_ID env var
# oauth_client_secret = "your-github-oauth-app-client-secret"  # Or set GITHUB-COPILOT_OAUTH_CLIENT_SECRET env var
# oauth_scopes = ["read:user", "workflow"]
# base_url = "https://api.githubcopilot.com/chat/completions"
# model = "gpt-4o"

# Ollama Example (uncomment to use)
# [[providers]]
# provider_type = "ollama"
# api_key = ""
# base_url = "http://localhost:11434/v1"
# model = "llama3.1:70b"

# AWS Bedrock Example (with AWS credentials)
# [[providers]]
# provider_type = "amazon-bedrock"
# auth_type = "aws"
# aws_profile = "default"  # Or set AWS_PROFILE env var
# region = "us-east-1"
# base_url = "https://bedrock-runtime.us-east-1.amazonaws.com"
# model = "anthropic.claude-3-5-sonnet-20241022-v2:0"

# Active provider and model selection
# default_provider = "openrouter"
# default_model = "anthropic/claude-sonnet-4"

[agent]
workspace = "~/.osagent/workspace"
active_workspace = "default"
workspaces = [
  { id = "default", name = "Default Workspace", path = "~/.osagent/workspace", description = "Default working directory", created_at = "2026-01-01T00:00:00Z", last_used = "2026-01-01T00:00:00Z" }
]
max_tokens = 16384
temperature = 0.7
checkpoint_enabled = true
checkpoint_interval = 5
# Enable prompt caching to reuse stable system prompt prefixes across turns.
# Reduces token usage and latency when using Claude models via OpenRouter.
# Works with OpenRouter (Anthropic models), OpenAI, and other providers that
# support automatic prompt caching. Set to false to rebuild the full prompt
# every turn.
prompt_cache_enabled = true
# Maximum number of nested subagent levels (the main agent counts as 0).
# Spawning deeper than this fails with an explicit error. Subagents already
# exclude the subagent tool from their allowlist; this config is the hard limit.
subagent_depth = 1
# Per-subagent-type model overrides, e.g. run explore subagents on a cheaper
# model while keeping the main agent on your default provider.
# Value is "provider_id:model" (provider must exist under [providers]) or just
# a model name (uses the default provider). Omitting an entry inherits the
# parent's provider and model.
# [agent.subagent_models]
# "explore" = "openrouter:deepseek/deepseek-r1"
# "general" = "anthropic:claude-3-7-sonnet-latest"
# When a background subagent finishes, automatically start a continuation turn
# on the parent conversation so the results reach the agent immediately instead
# of waiting for your next message. Results that arrive while the parent is busy
# are delivered right after its current run (and any queued messages) finish.
subagent_auto_resume = true
# Safety cap on consecutive auto-continuation turns (turns started only by
# background task completions, with no real user message in between). Prevents
# runaway spawn -> complete -> wake loops from burning tokens unattended.
subagent_auto_resume_max_turns = 5
# How many times a failed subagent run is relaunched at the task level when the
# failure looks transient (provider 5xx, rate limits, timeouts). Retries resume
# the same subagent session with exponential backoff, so completed work is kept.
subagent_task_max_retries = 2
# Policy for the agent's `sessions` tool reading or searching OTHER
# conversations (its own session and its own subagent sessions are always
# allowed). "ask" shows the same approval popup as outside-workspace access.
# Per-conversation overrides live in permission_rules with
# permission = "session_access" and glob patterns over resources like
# "session://<session-id>" or "session://*" (all sessions).
# session_access_default_action = "ask"   # ask | allow | deny

# Discord Bot (optional; requires building with `--features discord`)
# [discord]
# enabled = true
# token = "your-discord-bot-token"
# Turn this on to separate public support access from trusted full OSAgent access.
# Existing installations retain their original behavior while this is false.
# community_mode = true
# Allow all members in configured allowed_guilds to use restricted community chat.
# Requires at least one allowed_guilds entry; allowed_channels can narrow it further.
# allow_community_members = false
# community_context = "You are the support bot for MyProject. Answer setup and usage questions. Be concise, cite documentation, and send bugs to the issue tracker."
# docs_url = "https://docs.example.com"
# Optional new issue and pull request announcements (owner/repository).
# github_repo = "osagent/osagent"
# github_token = "" # Optional; raises GitHub API rate limits for private/high-traffic repos.
# github_tracking_channel = "456789012345678901"
# github_poll_seconds = 300
# A user id OR one of the member's role ids must be allowed unless
# allow_community_members is enabled for a configured community server.
# allowed_users = ["123456789012345678"]
# allowed_roles = ["234567890123456789"]
# Optional location restrictions. Empty means any guild/channel.
# allowed_guilds = ["345678901234567890"]
# allowed_channels = ["456789012345678901"]
# DMs require both this flag and an explicit allowed_users entry; roles never grant DM access.
# allow_dms = false
# Full machine-capable OSAgent access. Keep these limited to your personal server.
# trusted_users = ["123456789012345678"]
# trusted_roles = []
# trusted_guilds = ["567890123456789012"]
# trusted_channels = []

[tools]
denied = []

# Low-frequency built-in tools (code execution, LSP, weather, calendar,
# news, codesearch, system status, process, persona, task, memory/decision
# management, goals, coordinator, schedule, skill actions) are NOT loaded
# into every request. The agent sees a one-line manifest of what exists and
# calls `tool_search` to load a schema on demand — the same deferred-catalog
# pattern MCP servers use. Core tools (files, edits, bash, grep/glob, web,
# subagent, todos, skills, questions) are always loaded.
# To keep everything always loaded, deny `tool_search` here:
# denied = ["tool_search"]

[tools.repeat_reminder]
# Advisory loop nudge: escalating reminders when the same tool is called
# repeatedly with identical arguments. Unlike the hard loop guard this
# never blocks, it only injects user-role reminders.
enabled = true
thresholds = [3, 5, 8]        # consecutive identical calls that trigger a reminder
arguments_preview_chars = 500
include = ["*"]               # wildcard tool-name patterns that count
exclude = []                  # wildcard tool-name patterns that are transparent

[tools.bash]
allowed_commands = ["ls", "cat", "grep", "git", "npm", "cargo", "python", "node"]
timeout_seconds = 30

[tools.code_python]
enabled = true
timeout_seconds = 60
max_output_bytes = 1048576  # 1MB

[tools.code_node]
enabled = true
timeout_seconds = 60
max_output_bytes = 1048576

[tools.code_bash]
enabled = true
timeout_seconds = 60
max_output_bytes = 1048576

[tools.grep]
timeout_seconds = 60

[tools.glob]
timeout_seconds = 60

[spill]
# Oversized plain-text tool results are persisted verbatim to a
# session-scoped file and replaced in context with a bounded preview
# plus a retrieval hint, instead of being silently truncated.
enabled = true
root = "~/.osagent/spill"
max_inline_bytes = 24000

[compaction]
# Context-window compaction: when the request approaches the model's
# context window, older history is summarized into a
# <compacted-summary> frame (or pruned with a model-free head/tail
# pass first).
enabled = true
threshold_ratio = 0.8        # trigger at this fraction of the usable window
prune_enabled = true
prune_threshold_chars = 8192
prune_head_chars = 4096
prune_tail_chars = 1024
max_transcript_chars = 24000

[search]
# Enables the codesearch (quick-context) tool; web search is separate and always available.
enabled = true
max_results = 20
global_timeout_ms = 4500
per_backend_timeout_ms = 2000
max_parallel_backends = 5
searxng_instance_refresh_minutes = 30
searxng_max_instances = 2

[logging]
level = "info"  # trace, debug, info, warn, error
audit_enabled = true
audit_file = "~/.osagent/audit.log"

[storage]
database = "~/.osagent/osagent.db"

# --- MCP (Model Context Protocol) Servers ---
# Connect external tool servers. Their schemas are NOT loaded into every
# request: the agent sees a one-line summary per server and calls
# `tool_search` to load only the tools a task needs. Adding a server with
# 50 tools therefore costs about one line of context, not 50 schemas.
#
# The Settings > MCP Servers screen manages all of this, including a
# "Test connection" button. Editing by hand works too.
#
# [mcp]
# enabled = true
# max_activated_tools = 48    # ceiling on tools loaded into one session
# search_result_limit = 8     # results returned per tool_search call
# manifest_in_prompt = true   # keep the per-server summary in context
#
# Local server over stdio (most common):
# [[mcp.servers]]
# name = "filesystem"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "~/notes"]
# description = "Read and write files under ~/notes"
#
# Remote server over HTTP:
# [[mcp.servers]]
# name = "linear"
# url = "https://mcp.linear.app/mcp"
# headers = { Authorization = "Bearer YOUR_TOKEN" }
# description = "Issues, projects and cycles"
# # Tools listed here load at startup, skipping the tool_search step.
# # Each one costs context in every request, so keep the list short.
# always_active = ["create_issue"]

# --- Update Configuration ---
# Updates are served from Cloudflare R2 CDN.
# [update]
# enabled = true
# channel = "stable"          # stable, beta, dev
# check_on_startup = true
# check_interval_hours = 24

# Available provider presets and their models:
#   openrouter:  200+ models via openrouter.ai (Claude, GPT, Gemini, Llama, etc.)
#   openai:      GPT-4.1, GPT-4.1 Mini, GPT-4o, GPT-4o Mini, o3-mini
#   anthropic:   Claude Sonnet 4, Claude 3.5 Sonnet, Claude 3 Opus, Claude 3 Haiku
#   google:      Gemini 2.5 Pro, Gemini 2.5 Flash, Gemini 2.0 Flash
#   ollama:      Llama 3.1 70B, Qwen3 32B, Mistral 7B, CodeLlama 13B, DeepSeek R1 14B
#   groq:        Llama 3.3 70B, Llama 3.1 8B, Mixtral 8x7B
#   deepseek:    DeepSeek R1, DeepSeek V3
#   xai:         Grok 3, Grok 3 Mini
#
# Browse the full catalog in Settings > Provider or use the model dropdown in the header.
