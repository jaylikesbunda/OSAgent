[package]
name = "osagent"
version = "0.5.3"
edition = "2021"
rust-version = "1.78"
authors = ["OSA Contributors"]
license = "MIT"
description = "Secure local AI agent with a web UI, workspace tools, and optional Discord integration"
repository = "https://github.com/jaylikesbunda/OSAgent"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["ws", "multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "compression-br", "compression-gzip", "compression-deflate", "limit", "set-header"] }

# Discord bot
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "builder", "http", "cache"], optional = true }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
reqwest-eventsource = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Authentication
bcrypt = "0.15"
jsonwebtoken = "9.2"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.24"
shellexpand = "3.1"
tempfile = "3.9"
regex = "1.10"
globset = "0.4"
ignore = "0.4"
memchr = "2.7"
scraper = "0.19"
urlencoding = "2.1"
dashmap = "5.5"
walkdir = "2.5"
rayon = "1.10"
gix = { version = "0.68", default-features = false, features = ["max-performance-safe"] }

# Embed frontend
rust-embed = "8.2"
mime_guess = "2.0"

# Process management
sysinfo = "0.32"

# Base64 encoding
base64 = "0.22"
pdf-extract = "0.7"

# Audio decoding for Discord voice messages and audio attachments. whisper.cpp
# only accepts 16-bit WAV, so OGG/Opus, MP3, M4A, FLAC and friends are decoded
# to WAV in-process before transcription. Gated behind the discord feature so a
# non-Discord build does not pull in the libopus build (which needs cmake).
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "aac", "isomp4", "mkv", "ogg", "vorbis", "wav", "pcm", "alac", "adpcm", "mpa"], optional = true }
ogg = { version = "0.9", optional = true }
opus = { version = "0.3", optional = true }

# Discord voice playback (songbird). Gated behind discord-voice so default
# discord builds don't require cmake/libopus + ffmpeg runtime unless enabled.
songbird = { version = "0.6", features = ["serenity", "driver", "gateway", "rustls", "builtin-queue"], optional = true }

# Async streaming
async-stream = "0.3"
lazy_static = "1.4"

which = "6.0"

# Bytes handling
bytes = "1.5"

# ZIP handling
zip = "0.6"

# TAR/GZ handling
tar = "0.4"
flate2 = "1.0"

# Directory paths
dirs-next = "2.0"

# Version comparison
semver = "1.0"

# Encryption for OAuth tokens
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
local-ip-address = "0.6.11"

[build-dependencies]
serde_json = "1.0"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd = "0.15"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.9"
criterion = { version = "0.5", features = ["async_tokio"] }
memory-stats = "1.0"

[[bin]]
name = "osagent"
path = "src/main.rs"

[[bin]]
name = "osagent-optimize"
path = "src/bin/optimize.rs"

[[bin]]
name = "osagent-bench"
path = "src/bin/osagent-bench.rs"

[features]
default = []
discord = ["serenity", "dep:symphonia", "dep:ogg", "dep:opus"]
discord-voice = ["discord", "dep:songbird"]
production-frontend = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev-release]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
# Release profiles disable incremental by default; this profile exists for
# iteration, where reusing previous codegen is the whole point.
incremental = true

[[bench]]
name = "performance"
harness = false
